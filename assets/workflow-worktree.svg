<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1160" viewBox="0 0 1140 1160" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <style>
      .h1{font-size:32px;font-weight:800;fill:#0f172a}
      .h2{font-size:17px;fill:#475569}
      .pill{font-size:16px;font-weight:700}
      .box{font-size:16px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#475569}
      .tag{font-size:14px;font-weight:700}
      .note{font-size:14px;fill:#64748b}
      .lab{font-size:14px;font-weight:700;fill:#334155}
      .auto{font-size:14px;font-weight:700;fill:#0f766e}
      .gl{font-size:11px;font-weight:700;fill:#9333ea}
    </style>
  </defs>

  <rect width="1140" height="1160" fill="#f8fafc"/>

  <!-- Title -->
  <text x="50" y="66" class="h1">워크트리 기반 작업 규율</text>
  <text x="50" y="96" class="h2">이슈(또는 작업 설명) → 작업 항목(브랜치) → 태스크(커밋 누적)</text>

  <!-- Principle bars (2-layer model) -->
  <rect x="50" y="122" width="520" height="66" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="72" y="152" class="pill" fill="#4338ca">🌿 큰 단위 = 브랜치</text>
  <text x="72" y="176" class="sub">작업 항목(K) 1개  =  mirror 분기 1개</text>

  <rect x="590" y="122" width="500" height="66" rx="12" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="612" y="152" class="pill" fill="#0f766e">✓ 작업 단위 = 커밋</text>
  <text x="612" y="176" class="sub">태스크마다 커밋  ·  같은 K 분기에 누적</text>

  <!-- /wtflow-auto bracket over steps 3 & 4 -->
  <text x="644" y="214" class="auto" font-size="13">↻ /wtflow-auto — ③④ 자율 순회 (구현→검증→커밋) · 완료 시 /wtflow-briefing</text>
  <path d="M644,232 L644,224 L1090,224 L1090,232" fill="none" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Pipeline -->
  <g>
    <rect x="50" y="238" width="248" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="64" y="268" class="box">① /wtflow-issue <tspan class="sub" font-weight="400">(선택)</tspan></text>
    <text x="288" y="259" text-anchor="end" class="gl">GitLab</text>
    <text x="64" y="292" class="sub">이슈 생성 + 라벨 3종</text>
    <text x="64" y="311" class="sub">K 사이징 · 상세 계약은 note 로</text>

    <line x1="298" y1="280" x2="338" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="340" y="238" width="262" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="354" y="268" class="box">② /wtflow-plan</text>
    <text x="592" y="259" text-anchor="end" class="gl">GitLab (이슈 모드)</text>
    <text x="354" y="292" class="sub">이슈번호 또는 작업 설명(adhoc)</text>
    <text x="354" y="311" class="sub">워크트리 생성 + 진입 · 작업항목 = K</text>

    <line x1="602" y1="280" x2="642" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="644" y="238" width="198" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="658" y="268" class="box">③ 워크트리 구현</text>
    <text x="658" y="292" class="sub">한 번에 한 작업 항목(K)</text>
    <text x="658" y="311" class="sub">완료 전 다음 K 시작 금지</text>

    <line x1="842" y1="280" x2="882" y2="280" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowT)"/>

    <rect x="884" y="238" width="206" height="84" rx="12" fill="#ecfeff" stroke="#0d9488" stroke-width="1.5"/>
    <text x="898" y="268" class="box">④ /wtflow-commit</text>
    <text x="898" y="292" class="sub">태스크마다 호출</text>
    <text x="898" y="311" class="sub">→ K 분기에 커밋 누적</text>
  </g>

  <!-- Auxiliary skills -->
  <rect x="50" y="346" width="612" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="66" y="373" class="note"><tspan font-weight="700" fill="#334155">/wtflow-progress</tspan>  —  커밋마다 진행 현황 표 (읽기 전용 · 커밋/푸시 안 함)</text>

  <rect x="678" y="346" width="412" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="694" y="373" class="note"><tspan font-weight="700" fill="#334155">/wtflow-merge · wtflow-clean</tspan>  —  develop 머지 → 워크트리·브랜치 정리</text>

  <!-- legend: core vs adapter -->
  <text x="50" y="416" class="note"><tspan class="gl">◆ GitLab</tspan> = 이슈 어댑터 (① · /wtflow-milestone · ②의 이슈 모드 — glab 필요)  ·  <tspan fill="#0f766e" font-weight="700">이슈 없이 ②부터 시작하면 전부 호스트 무관</tspan></text>

  <!-- Git graph -->
  <text x="50" y="458" class="lab">git 그래프 — 한 이슈, 작업 항목 2개</text>

  <line x1="90" y1="512" x2="1090" y2="512" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="150" cy="512" r="8" fill="#94a3b8"/>
  <circle cx="300" cy="512" r="8" fill="#94a3b8"/>
  <text x="90" y="498" class="note">develop (base)</text>

  <!-- branch K1 -->
  <path d="M300,512 C322,592 344,592 366,592 L660,592" fill="none" stroke="#6366f1" stroke-width="3"/>
  <circle cx="430" cy="592" r="12" fill="#fff" stroke="#0d9488" stroke-width="3"/>
  <text x="422" y="597" class="tag" fill="#0f766e">a</text>
  <circle cx="545" cy="592" r="12" fill="#fff" stroke="#0d9488" stroke-width="3"/>
  <text x="537" y="597" class="tag" fill="#0f766e">b</text>
  <circle cx="655" cy="592" r="12" fill="#fff" stroke="#0d9488" stroke-width="3"/>
  <text x="647" y="597" class="tag" fill="#0f766e">c</text>
  <text x="120" y="597" class="sub" fill="#4338ca">feat/#42-slug (워크트리 브랜치)</text>
  <text x="120" y="616" class="sub" fill="#64748b">이슈 없으면 feat/+slug</text>
  <text x="366" y="572" class="lab" fill="#4338ca">작업 항목 1  (= K1)</text>
  <line x1="667" y1="592" x2="715" y2="592" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="718" y="576" width="200" height="32" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="732" y="597" class="sub" fill="#4338ca">mirror feat/#42-slug-001</text>

  <!-- branch K2 -->
  <path d="M655,592 C710,677 730,677 752,677 L900,677" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <circle cx="810" cy="677" r="12" fill="#fff" stroke="#0d9488" stroke-width="3"/>
  <text x="802" y="682" class="tag" fill="#0f766e">d</text>
  <circle cx="895" cy="677" r="12" fill="#fff" stroke="#0d9488" stroke-width="3"/>
  <text x="887" y="682" class="tag" fill="#0f766e">e</text>
  <text x="752" y="657" class="lab" fill="#6d28d9">작업 항목 2  (= K2)</text>
  <line x1="907" y1="677" x2="918" y2="677" stroke="#8b5cf6" stroke-width="2.5"/>
  <rect x="905" y="702" width="200" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
  <line x1="905" y1="685" x2="960" y2="702" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="919" y="723" class="sub" fill="#6d28d9">mirror feat/#42-slug-002</text>

  <!-- callouts -->
  <line x1="545" y1="606" x2="500" y2="807" stroke="#0d9488" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="120" y="837" class="lab" fill="#0f766e">○ a · b · c = 태스크마다 커밋 (같은 K 분기에 누적)</text>
  <text x="120" y="862" class="note">한 작업 항목의 여러 태스크를 커밋 없이 한 덩어리로 진행 금지</text>

  <!-- boundary note -->
  <rect x="50" y="902" width="1040" height="110" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="74" y="942" class="box" fill="#b45309">⚑ 작업 항목(K) 경계 = 커밋 체크포인트</text>
  <text x="74" y="970" class="note">K 하나를 끝내면 멈춰 커밋 → 커밋 후에만 다음 K 시작 (사용자가 "묶어서 가" 명시 시 batch 예외)</text>
  <text x="74" y="994" class="note">큰 작업이면 K 별 mirror 분기로, 작은 작업이면 develop 으로 직접 PR 1개</text>

  <!-- commit convention -->
  <rect x="50" y="1036" width="1040" height="96" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="74" y="1074" class="box">커밋 컨벤션</text>
  <text x="74" y="1102" class="note">&lt;type&gt;(&lt;scope&gt;): 한글 요약  —  type·scope 는 영어, 요약은 한글</text>
  <text x="74" y="1122" class="note">코드가 무엇을 했는지가 아니라 사용자/시스템 관점에서 무엇이 달라졌는지(동작/결과)를 적는다</text>
</svg>
